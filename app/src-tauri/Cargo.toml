[package]
name = "agent-interactive-app"
version = "0.1.0"
edition = "2024"
description = "Say a change to a web page and watch the agents make it"
license = "MIT"

[lib]
name = "agent_interactive_app"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"

[profile.release]
opt-level = "s"
lto = true
